name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build and package
    # Helpers are Mach-O binaries built with Xcode tools and codesign, so packaging needs macOS.
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run validate
      - run: npm run typecheck
      - run: npm test

      - name: Cache the pinned ffmpeg build
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/puros-build
          key: puros-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/puros-provider-sdk/tooling/ffmpeg.mjs', 'node_modules/puros-provider-sdk/tooling/soxr.mjs') }}

      - name: Check the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./provider.manifest.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match provider.manifest.json version ${version}" >&2
            exit 1
          fi

      - name: Build and package
        env:
          SIGNING_KEY: ${{ secrets.PUROS_PROVIDER_SIGNING_KEY }}
        run: |
          # Release tags are signed when the repository has a publisher key; other builds stay unsigned.
          if [ -n "${SIGNING_KEY}" ] && [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            key="${RUNNER_TEMP}/puros-provider-signing.pem"
            printf '%s\n' "${SIGNING_KEY}" > "${key}"
            chmod 600 "${key}"
            export PUROS_PROVIDER_SIGNING_KEY="${key}"
          fi
          npm run package
          rm -f "${RUNNER_TEMP}/puros-provider-signing.pem"

      - uses: actions/upload-artifact@v4
        with:
          name: provider-package
          path: release/
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: provider-package
          path: release

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/*.zip release/*.sha256 --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
