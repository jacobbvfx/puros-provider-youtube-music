name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every push to main gets its own release, so only pull request builds are superseded.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and package
    # Helpers are Mach-O binaries built with Xcode tools and codesign, so packaging needs macOS.
    runs-on: macos-15
    timeout-minutes: 120
    outputs:
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run validate
      - run: npm run typecheck
      - run: npm test

      - name: Cache the pinned ffmpeg build
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/puros-build
          key: puros-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/puros-provider-sdk/tooling/ffmpeg.mjs', 'node_modules/puros-provider-sdk/tooling/soxr.mjs') }}

      - name: Read the manifest version
        id: manifest
        run: echo "version=$(node -p "require('./provider.manifest.json').version")" >> "${GITHUB_OUTPUT}"

      - name: Check the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match provider.manifest.json version ${VERSION}" >&2
            exit 1
          fi

      - name: Build and package
        env:
          SIGNING_KEY: ${{ secrets.PUROS_PROVIDER_SIGNING_KEY }}
        run: |
          # Released builds (pushes to main and tags) are signed when the repository has a publisher key.
          if [ -n "${SIGNING_KEY}" ] && [ "${GITHUB_EVENT_NAME}" = push ]; then
            key="${RUNNER_TEMP}/puros-provider-signing.pem"
            printf '%s\n' "${SIGNING_KEY}" > "${key}"
            chmod 600 "${key}"
            export PUROS_PROVIDER_SIGNING_KEY="${key}"
          fi
          npm run package
          rm -f "${RUNNER_TEMP}/puros-provider-signing.pem"

      - uses: actions/upload-artifact@v4
        with:
          name: provider-package
          path: release/
          if-no-files-found: error

  release:
    name: Publish release
    # Every push to main publishes v<version>-build.<run>; a v<version> tag publishes v<version>.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: provider-package
          path: release

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            title="${tag}"
          else
            tag="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
            title="${VERSION} build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          fi
          {
            echo "${COMMIT_MESSAGE%%$'\n'*}"
            echo
            echo "Commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
            echo
            echo "Install: Puros → Settings → Accounts → Install provider…, then choose the ZIP below."
            echo
            echo '```'
            cat release/*.sha256
            echo '```'
          } > notes.md
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            # A re-run of the same workflow run replaces the assets of its release.
            gh release upload "${tag}" release/*.zip release/*.sha256 --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${tag}" release/*.zip release/*.sha256 --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" --title "${title}" --notes-file notes.md --latest
          fi
